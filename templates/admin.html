<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin CRUD - MEGZ STORE ID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4"><div class="container"><span class="navbar-brand">Admin Panel</span><a href="/" class="btn btn-light btn-sm">Ke Toko</a></div></nav>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <h5>Tambah Produk</h5>
                <input type="text" id="n" class="form-control mb-2" placeholder="Nama">
                <input type="text" id="c" class="form-control mb-2" placeholder="Kategori">
                <input type="number" id="p" class="form-control mb-2" placeholder="Harga">
                <input type="number" id="s" class="form-control mb-2" placeholder="Stok">
                <button onclick="add()" class="btn btn-success w-100">Simpan</button>
            </div>
            <div class="col-md-8">
                <table class="table table-striped">
                    <thead><tr><th>Nama</th><th>Harga</th><th>Aksi</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        async function load() {
            const res = await fetch('/api/products');
            const data = await res.json();
            document.getElementById('list').innerHTML = data.map(i => `
                <tr><td>${i.name}</td><td>${i.price}</td>
                <td><button onclick="del(${i.id})" class="btn btn-danger btn-sm">Hapus</button></td></tr>
            `).join('');
        }
        async function add() {
            await fetch('/api/products', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name:document.getElementById('n').value, category:document.getElementById('c').value, price:document.getElementById('p').value, stock:document.getElementById('s').value})
            });
            load();
        }
        async function del(id) {
            await fetch(`/api/products/${id}`, {method: 'DELETE'});
            load();
        }
        load();
    </script>
</body>
</html>
