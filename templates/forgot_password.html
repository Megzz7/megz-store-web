<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lupa Password - MEGZ STORE ID</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { border-radius: 15px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold">Lupa Password?</h3>
                        <p class="text-muted">Masukkan username Anda untuk membuat password baru.</p>
                    </div>

                    {% if error %}
                    <div class="alert alert-danger text-center">{{ error }}</div>
                    {% endif %}

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" name="username" class="form-control rounded-pill" required placeholder="Masukkan username Anda">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Password Baru</label>
                            <input type="password" name="new_password" class="form-control rounded-pill" required placeholder="Masukkan password baru">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold mb-3">Reset Password</button>
                    </form>
                    
                    <div class="text-center">
                        <a href="/login" class="text-decoration-none">Kembali ke Halaman Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
